<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0e10">
  <title>Controle LG</title>
  <style>
    :root {
      --fundo: #0e0e10;
      --corpo: #1b1b1f;
      --borda: #2a2a30;
      --tecla: #2b2b31;
      --tecla-ativa: #3a3a42;
      --texto: #ececf1;
      --texto-fraco: #9a9aa6;
      --vermelho: #d32f2f;
      --ok: #66bb6a;
      --erro: #ef5350;
      --raio: 14px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    html, body { margin: 0; background: var(--fundo); }
    body {
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      color: var(--texto); font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 16px 16px calc(80px + env(safe-area-inset-bottom));
      -webkit-user-select: none; user-select: none;
    }
    .aviso {
      width: 100%; max-width: 340px; margin-bottom: 12px; padding: 12px 14px; border-radius: 12px;
      background: #3a2a00; color: #ffd54f; font-size: 14px; line-height: 1.4;
    }
    .aviso.desconectado { background: #3b1414; color: #ef9a9a; }

    .controle {
      width: 100%; max-width: 340px; background: var(--corpo); border: 1px solid var(--borda);
      border-radius: 36px; padding: 22px 18px 26px; display: flex; flex-direction: column; gap: 18px;
    }
    .linha { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

    button.tecla {
      border: 0; color: var(--texto); background: var(--tecla); border-radius: var(--raio);
      font: 600 15px/1 inherit; font-family: inherit; min-height: 48px; cursor: pointer;
      touch-action: manipulation; display: flex; align-items: center; justify-content: center;
      transition: background .08s, transform .08s;
    }
    button.tecla:active { background: var(--tecla-ativa); transform: scale(.96); }
    button.tecla svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2;
                       stroke-linecap: round; stroke-linejoin: round; }
    .rotulo-pequeno { font-size: 12px; font-weight: 600; letter-spacing: .3px; }

    .redondo { width: 52px; height: 52px; border-radius: 50%; }
    .power { background: var(--vermelho) !important; }

    .numeros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .numeros .tecla { font-size: 20px; min-height: 50px; }

    .meio { display: grid; grid-template-columns: 64px 1fr 64px; gap: 12px; align-items: stretch; }
    .balanco {
      display: flex; flex-direction: column; border-radius: 32px; background: var(--tecla); overflow: hidden;
    }
    .balanco .tecla { background: transparent; border-radius: 0; min-height: 58px; font-size: 22px; }
    .balanco .legenda { text-align: center; font-size: 11px; color: var(--texto-fraco); padding: 2px 0; }
    .centro { display: flex; flex-direction: column; gap: 10px; justify-content: center; }

    .atalhos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .atalhos .tecla { min-height: 42px; }

    .dpad {
      position: relative; width: 210px; height: 210px; margin: 0 auto; border-radius: 50%;
      background: var(--tecla);
    }
    .dpad .tecla { position: absolute; background: transparent; min-height: 0; }
    .dpad .tecla:active { background: var(--tecla-ativa); }
    .dpad [data-tecla="CIMA"]     { top: 0; left: 70px; width: 70px; height: 70px; border-radius: 50% 50% 0 0; }
    .dpad [data-tecla="BAIXO"]    { bottom: 0; left: 70px; width: 70px; height: 70px; border-radius: 0 0 50% 50%; }
    .dpad [data-tecla="ESQUERDA"] { left: 0; top: 70px; width: 70px; height: 70px; border-radius: 50% 0 0 50%; }
    .dpad [data-tecla="DIREITA"]  { right: 0; top: 70px; width: 70px; height: 70px; border-radius: 0 50% 50% 0; }
    .dpad [data-tecla="OK"] {
      top: 62px; left: 62px; width: 86px; height: 86px; border-radius: 50%;
      background: #34343c; font-size: 17px;
    }

    .midia { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .midia .tecla { min-height: 44px; }

    .modelo-atual {
      width: 100%; max-width: 340px; display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; padding: 0 6px; font-size: 13px; color: var(--texto-fraco);
    }
    .modelo-atual strong { color: var(--texto); font-weight: 600; }
    .link { background: none; border: 0; color: #8ab4f8; font: inherit; font-weight: 600; cursor: pointer;
            padding: 8px 4px; }

    .escolha {
      width: 100%; max-width: 340px; background: var(--corpo); border: 1px solid var(--borda);
      border-radius: 24px; padding: 22px 20px; display: flex; flex-direction: column; gap: 14px;
    }
    .escolha h1 { margin: 0; font-size: 20px; }
    .escolha p { margin: 0; color: var(--texto-fraco); font-size: 14px; line-height: 1.45; }
    .escolha label { font-size: 13px; color: var(--texto-fraco); display: flex; flex-direction: column; gap: 6px; }
    .escolha input, .escolha select {
      background: var(--tecla); border: 1px solid var(--borda); color: var(--texto); border-radius: 12px;
      font: 16px inherit; font-family: inherit; padding: 12px; width: 100%;
    }
    .escolha input { text-transform: uppercase; letter-spacing: .5px; }
    .escolha .botao {
      border: 0; border-radius: 12px; padding: 13px; font: 600 15px inherit; font-family: inherit;
      background: #3d5afe; color: #fff; cursor: pointer;
    }
    .escolha .botao.secundario { background: var(--tecla); color: var(--texto); }
    .escolha .dupla { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; }
    .divisor { display: flex; align-items: center; gap: 10px; color: var(--texto-fraco); font-size: 12px; }
    .divisor::before, .divisor::after { content: ""; flex: 1; height: 1px; background: var(--borda); }
    .resultado { padding: 12px; border-radius: 12px; background: #16261a; color: #a5d6a7; font-size: 14px; }
    .resultado.erro { background: #3b1414; color: #ef9a9a; }
    .dica { font-size: 13px !important; background: #1f2230; padding: 10px 12px; border-radius: 12px; }

    .retorno {
      position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 999px; font-size: 14px;
      background: #26262c; border: 1px solid var(--borda); opacity: 0; pointer-events: none;
      transition: opacity .15s;
    }
    .retorno.visivel { opacity: 1; }
    .retorno.ok { color: var(--ok); }
    .retorno.erro { color: var(--erro); }
  </style>
</head>
<body>
  <div class="aviso" role="alert" hidden></div>

  <section class="escolha" id="escolher-modelo" aria-labelledby="titulo-modelo" hidden>
    <h1 id="titulo-modelo">Qual é a sua TV?</h1>
    <p>O modelo define quais Teclas de Serviço e senhas valem para a sua TV.</p>

    <label>Código do modelo
      <input id="codigo-modelo" placeholder="Ex.: OLED55C1PSA" autocomplete="off" autocapitalize="characters" spellcheck="false">
    </label>
    <button class="botao" id="usar-codigo" type="button">Usar este código</button>
    <div class="resultado" id="resultado-codigo" role="status" hidden></div>
    <button class="botao" id="confirmar-codigo" type="button" hidden>Confirmar</button>

    <div class="divisor">ou escolha na lista</div>

    <div class="dupla">
      <label>Linha <select id="linha-modelo"></select></label>
      <label>Ano <select id="ano-modelo"></select></label>
    </div>
    <button class="botao secundario" id="salvar-lista" type="button">Salvar linha e ano</button>

    <p class="dica">Onde achar o modelo: na etiqueta atrás da TV, ou na própria TV em
      Configurações › Suporte › Informações da TV.</p>
    <button class="link" id="cancelar-troca" type="button" hidden>Cancelar</button>
  </section>

  <div class="modelo-atual" hidden>
    <span>Modelo: <strong id="descricao-modelo"></strong></span>
    <button class="link" id="trocar-modelo" type="button">Trocar</button>
  </div>

  <main class="controle" aria-label="Controle remoto LG" hidden>
    <div class="linha">
      <button class="tecla redondo power" data-tecla="POWER" aria-label="Ligar/desligar">
        <svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
      </button>
      <button class="tecla redondo" data-tecla="INPUT" aria-label="Entrada">
        <svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></svg>
      </button>
    </div>

    <div class="numeros">
      <button class="tecla" data-tecla="1">1</button>
      <button class="tecla" data-tecla="2">2</button>
      <button class="tecla" data-tecla="3">3</button>
      <button class="tecla" data-tecla="4">4</button>
      <button class="tecla" data-tecla="5">5</button>
      <button class="tecla" data-tecla="6">6</button>
      <button class="tecla" data-tecla="7">7</button>
      <button class="tecla" data-tecla="8">8</button>
      <button class="tecla" data-tecla="9">9</button>
      <button class="tecla rotulo-pequeno" data-tecla="GUIA">GUIA</button>
      <button class="tecla" data-tecla="0">0</button>
      <button class="tecla rotulo-pequeno" data-tecla="INFO">INFO</button>
    </div>

    <div class="meio">
      <div class="balanco">
        <button class="tecla" data-tecla="VOL_MAIS" aria-label="Volume +">+</button>
        <span class="legenda">VOL</span>
        <button class="tecla" data-tecla="VOL_MENOS" aria-label="Volume −">−</button>
      </div>
      <div class="centro">
        <button class="tecla" data-tecla="MUDO" aria-label="Mudo">
          <svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M22 9l-6 6"/><path d="M16 9l6 6"/></svg>
        </button>
        <button class="tecla" data-tecla="HOME" aria-label="Home">
          <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
        </button>
      </div>
      <div class="balanco">
        <button class="tecla" data-tecla="CANAL_MAIS" aria-label="Canal +">
          <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
        </button>
        <span class="legenda">CH</span>
        <button class="tecla" data-tecla="CANAL_MENOS" aria-label="Canal −">
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
    </div>

    <div class="atalhos">
      <button class="tecla" data-tecla="CONFIGURACOES" aria-label="Configurações">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <button class="tecla rotulo-pequeno" data-tecla="VOLTAR" aria-label="Voltar">
        <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
      </button>
    </div>

    <div class="dpad">
      <button class="tecla" data-tecla="CIMA" aria-label="Cima"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
      <button class="tecla" data-tecla="ESQUERDA" aria-label="Esquerda"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="tecla" data-tecla="OK">OK</button>
      <button class="tecla" data-tecla="DIREITA" aria-label="Direita"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="tecla" data-tecla="BAIXO" aria-label="Baixo"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>

    <div class="midia">
      <button class="tecla" data-tecla="RETROCEDER" aria-label="Retroceder"><svg viewBox="0 0 24 24"><path d="M11 19l-7-7 7-7z"/><path d="M20 19l-7-7 7-7z"/></svg></button>
      <button class="tecla" data-tecla="PLAY" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></button>
      <button class="tecla" data-tecla="PAUSA" aria-label="Pausa"><svg viewBox="0 0 24 24"><path d="M8 5v14"/><path d="M16 5v14"/></svg></button>
      <button class="tecla" data-tecla="PARAR" aria-label="Parar"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></button>
      <button class="tecla" data-tecla="AVANCAR" aria-label="Avançar"><svg viewBox="0 0 24 24"><path d="M13 19l7-7-7-7z"/><path d="M4 19l7-7-7-7z"/></svg></button>
    </div>
  </main>

  <div class="retorno" role="status" aria-live="polite"></div>

  <script>
    const aviso = document.querySelector('.aviso');
    fetch('/api/emissor/estado').then((r) => r.json()).then(({ estado, mensagem }) => {
      if (estado === 'conectado') return;
      aviso.textContent = estado === 'nao_configurado'
        ? 'Emissor IR não configurado. ' + mensagem
        : mensagem;
      aviso.classList.add(estado);
      aviso.hidden = false;
    }).catch(() => {});

    const retorno = document.querySelector('.retorno');
    let esconder;
    function mostrar(texto, tipo) {
      retorno.textContent = texto;
      retorno.className = 'retorno visivel ' + tipo;
      clearTimeout(esconder);
      esconder = setTimeout(() => retorno.classList.remove('visivel'), tipo === 'erro' ? 4000 : 1200);
    }

    // ----- Modelo da TV -----
    const telaEscolha = document.getElementById('escolher-modelo');
    const controle = document.querySelector('.controle');
    const barraModelo = document.querySelector('.modelo-atual');
    const campoCodigo = document.getElementById('codigo-modelo');
    const resultado = document.getElementById('resultado-codigo');
    const confirmar = document.getElementById('confirmar-codigo');
    const seletorLinha = document.getElementById('linha-modelo');
    const seletorAno = document.getElementById('ano-modelo');
    const cancelar = document.getElementById('cancelar-troca');
    let codigoDecifrado = null;
    let temModelo = false;

    function mostrarControle(modelo) {
      temModelo = true;
      document.getElementById('descricao-modelo').textContent = modelo.descricao;
      telaEscolha.hidden = true;
      barraModelo.hidden = false;
      controle.hidden = false;
    }

    function mostrarEscolha() {
      telaEscolha.hidden = false;
      barraModelo.hidden = true;
      controle.hidden = true;
      cancelar.hidden = !temModelo;
      resultado.hidden = true;
      confirmar.hidden = true;
      codigoDecifrado = null;
    }

    function mostrarResultado(texto, erro) {
      resultado.textContent = texto;
      resultado.classList.toggle('erro', erro);
      resultado.hidden = false;
    }

    async function salvar(escolha) {
      const resp = await fetch('/api/modelo', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(escolha),
      });
      const corpo = await resp.json();
      if (resp.ok) mostrarControle(corpo.modelo);
      else mostrarResultado(corpo.mensagem || 'Não foi possível salvar.', true);
    }

    document.getElementById('usar-codigo').addEventListener('click', async () => {
      const codigo = campoCodigo.value.trim();
      confirmar.hidden = true;
      const resp = await fetch('/api/modelo/decodificar', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ codigo }),
      });
      const corpo = await resp.json();
      if (resp.ok) {
        codigoDecifrado = corpo.codigo;
        mostrarResultado(`${corpo.codigo}: ${corpo.linha}, ${corpo.ano}. Está certo?`, false);
        confirmar.hidden = false;
      } else {
        codigoDecifrado = null;
        mostrarResultado(corpo.mensagem, true);
        seletorLinha.focus();
      }
    });
    campoCodigo.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('usar-codigo').click();
    });
    confirmar.addEventListener('click', () => codigoDecifrado && salvar({ codigo: codigoDecifrado }));
    document.getElementById('salvar-lista').addEventListener('click', () =>
      salvar({ linha: seletorLinha.value, ano: Number(seletorAno.value) }));
    document.getElementById('trocar-modelo').addEventListener('click', mostrarEscolha);
    cancelar.addEventListener('click', () => {
      telaEscolha.hidden = true; barraModelo.hidden = false; controle.hidden = false;
    });

    fetch('/api/modelo/opcoes').then((r) => r.json()).then(({ linhas, anos }) => {
      seletorLinha.innerHTML = linhas.map((l) => `<option>${l}</option>`).join('');
      seletorAno.innerHTML = anos.slice().reverse().map((a) => `<option>${a}</option>`).join('');
    });
    fetch('/api/modelo').then((r) => r.json()).then(({ modelo }) => {
      if (modelo) mostrarControle(modelo); else mostrarEscolha();
    });

    // ----- Teclas -----
    document.querySelectorAll('button.tecla').forEach((botao) => {
      botao.addEventListener('click', async () => {
        const tecla = botao.dataset.tecla;
        if (navigator.vibrate) navigator.vibrate(10);
        try {
          const resp = await fetch(`/api/teclas/${encodeURIComponent(tecla)}/enviar`, { method: 'POST' });
          const corpo = await resp.json().catch(() => ({}));
          if (resp.ok) mostrar('Enviado ao Emissor IR', 'ok');
          else mostrar(corpo.mensagem || 'Erro ao enviar', 'erro');
        } catch (e) {
          mostrar('Sem conexão com o servidor', 'erro');
        }
      });
    });
  </script>
</body>
</html>
